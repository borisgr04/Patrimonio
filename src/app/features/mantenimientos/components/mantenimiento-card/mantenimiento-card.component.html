@if (mantenimiento(); as item) {
  <app-card [title]="item.tipoMantenimiento" [subtitle]="inmueble()">
    <div class="space-y-4 text-sm">
      <div class="flex items-center justify-between gap-3">
        <div>
          <p>{{ item.descripcion }}</p>
          <p class="pos-subtle">{{ item.fechaMantenimiento | fechaEs }}</p>
        </div>
        <app-mantenimiento-estado-badge [estado]="item.estado" />
      </div>
      <p class="font-medium">Costo: {{ item.costoTotal | currencyCop }}</p>
      <div class="flex flex-wrap gap-2">
        <a mat-stroked-button [routerLink]="['/mantenimientos', item.id]">Ver detalle</a>
        <button mat-button [matMenuTriggerFor]="menu" type="button">Actualizar estado</button>
      </div>
      <mat-menu #menu="matMenu">
        @for (estado of estados; track estado) {
          <button mat-menu-item type="button" (click)="cambiarEstado.emit(estado)">
            {{ estado }}
          </button>
        }
      </mat-menu>
    </div>
  </app-card>
}
