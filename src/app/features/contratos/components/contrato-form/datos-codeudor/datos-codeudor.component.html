@if (form; as currentForm) {
  <div class="grid gap-4 md:grid-cols-2" [formGroup]="currentForm">
    <mat-form-field
      ><mat-label>Nombres</mat-label><input matInput formControlName="nombres"
    /></mat-form-field>
    <mat-form-field
      ><mat-label>Apellidos</mat-label><input matInput formControlName="apellidos"
    /></mat-form-field>
    <mat-form-field
      ><mat-label>Cédula</mat-label><input matInput formControlName="cedula"
    /></mat-form-field>
    <mat-form-field
      ><mat-label>Celular</mat-label><input matInput formControlName="telefonoCelular"
    /></mat-form-field>
    <mat-form-field
      ><mat-label>Correo</mat-label><input matInput formControlName="correo"
    /></mat-form-field>
    <mat-form-field
      ><mat-label>Ciudad</mat-label><input matInput formControlName="ciudad"
    /></mat-form-field>
    <mat-form-field class="md:col-span-2"
      ><mat-label>Dirección</mat-label><input matInput formControlName="direccionResidencia"
    /></mat-form-field>
    <mat-form-field
      ><mat-label>Empresa</mat-label><input matInput formControlName="empresaTrabajo"
    /></mat-form-field>
    <mat-form-field
      ><mat-label>Cargo</mat-label><input matInput formControlName="cargo"
    /></mat-form-field>
    <mat-form-field
      ><mat-label>Teléfono empresa</mat-label><input matInput formControlName="telefonoEmpresa"
    /></mat-form-field>
    <mat-form-field
      ><mat-label>Ingresos mensuales</mat-label
      ><input matInput type="number" formControlName="ingresosMensuales"
    /></mat-form-field>
  </div>
}
